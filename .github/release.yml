changelog:
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🔒 Security
      labels:
        - security
    - title: 🧪 Tests
      labels:
        - tests
    - title: 🔧 Maintenance
      labels:
        - chore
        - refactor
    - title: Other Changes
      labels:
        - "*"
